<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planar Map Marker</title>
    <meta name="description" content="A pure frontend planar map marker. Upload custom maps, add cross-floor paths, edit QGIS-like data tables, and export to GeoJSON."/>
    <script>
      // Apply the stored theme before first paint so there is no light flash on
      // load. Kept in sync with src/lib/theme.ts.
      (() => {
        var stored = null
        try {
          stored = localStorage.getItem("planar-map-marker:theme")
        } catch {}
        var dark =
          stored === "dark" ||
          ((stored === "system" || !stored) &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
